name: Release

on:
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install PNPM
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create Version PR or Publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: pnpm pkg:publish
          title: 'chore: bump version'
          commit: 'chore: bump version'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./packages/eslint-config-airbnb-extended/package.json').version")
          TAG="V${VERSION}"

          # Notes: the matching section of CHANGELOG.md
          awk -v v="$VERSION" '
            /^## / { if (found) exit; if ($2 == v) { found = 1 } }
            found { print }
          ' CHANGELOG.md > notes.md

          if [ ! -s notes.md ]; then
            echo "No CHANGELOG.md section found for ${VERSION}" >&2
            exit 1
          fi

          # Previous version is the next "## x.y.z" heading after this one
          PREVIOUS=$(awk -v v="$VERSION" '/^## / { if (found) { print $2; exit } if ($2 == v) found = 1 }' CHANGELOG.md)
          PREVIOUS_TAG="V${PREVIOUS}"
          if ! git rev-parse -q --verify "refs/tags/${PREVIOUS_TAG}" >/dev/null; then
            PREVIOUS_TAG="eslint-config-airbnb-extended@${PREVIOUS}"
          fi

          {
            echo
            echo '---'
            echo
            echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREVIOUS_TAG}...${TAG}"
          } >> notes.md

          gh release create "$TAG" --title "$TAG" --notes-file notes.md --target master --latest
